<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#e8e7e1">
    <title>{% if page.title %}{{ page.title | escape }}{% else %}{{ site.title | escape }}{% endif %}</title>
    <meta name="description" content="{{ page.description | default: page.excerpt | default: site.description | strip_html | normalize_whitespace | truncate: 160 | escape }}">
    <link rel="canonical" href="{{ page.url | replace:'index.html','' | absolute_url }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Manrope:wght@400;500;600&family=Newsreader:ital,opsz,wght@1,6..72,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ 'css/main.css' | relative_url }}">
    <link rel="stylesheet" href="{{ 'css/code.css' | relative_url }}">
    {% seo %}
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Justin Oblak",
      "url": "{{ site.url }}",
      "jobTitle": "Engineering Executive and AI Leader",
      "homeLocation": { "@type": "Place", "name": "New York City" },
      "knowsAbout": ["Artificial Intelligence", "Engineering Leadership", "Machine Learning", "Platform Engineering", "Application Security", "Software Architecture"],
      "sameAs": ["https://www.linkedin.com/in/justinoblak", "https://github.com/jroblak", "https://x.com/jroblak"]
    }
    </script>
  </head>
  <body class="{% if page.home %}is-home{% endif %}">
    <a class="skip-link" href="#main">Skip to content</a>
    <div class="site-shell">
      <header class="site-header">
        <a class="wordmark" href="{{ '/' | relative_url }}" aria-label="Justin Oblak, home">
          <span class="wordmark-mark">JO</span>
          <span>Justin Oblak</span>
        </a>
        <nav aria-label="Primary navigation">
          <a href="{{ '/#about' | relative_url }}">About</a>
          <a href="{{ '/patents.html' | relative_url }}">Patents</a>
          <a href="https://www.linkedin.com/in/justinoblak">LinkedIn <span aria-hidden="true">↗</span></a>
        </nav>
      </header>

      {% unless page.home %}<main id="main" class="page-content">{% endunless %}
      {{ content }}
      {% unless page.home %}</main>{% endunless %}

      <footer class="site-footer">
        <p>Justin Oblak <span>© <span id="year">2026</span></span></p>
        <a href="mailto:hello@justinoblak.com">hello@justinoblak.com</a>
      </footer>
    </div>
    <script src="{{ 'js/main.js' | relative_url }}"></script>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-542WQKJJCJ"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-542WQKJJCJ');
    </script>
  </body>
</html>
